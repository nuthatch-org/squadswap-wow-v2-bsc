schema_version = 1

[nest]
description = """SquadSwap WOW v2 on BNB Smart Chain - a concentrated-liquidity DEX forked from PancakeSwap V3, itself a Uniswap V3 fork. Every pool is discovered at runtime from the factory's PoolCreated event, so there is no per-pool configuration anywhere in this nest.

Two things differ from a vanilla Uniswap V3 nest and are worth knowing before you query. Swap carries two extra parameters, protocolFeesToken0 and protocolFeesToken1, which vanilla V3 does not emit. And a separate PoolManager contract can override a pool's fee independently of the tier it was created with, so the fee a pool charges is not necessarily the fee in its PoolCreated row - use the pool_effective_fee view rather than factory__pool_created.fee.

Amounts: use the *_dec DECIMAL companions for arithmetic. The bare uint256/int256 columns are exact text and must never be summed. Token symbols and decimals need a contract call and are deliberately not indexed; join a vendored token list for human labels.

Ported from the live subgraph deployment QmQTCx7o6NW9SdJuyQSCYz71YLm3K43dkmtjZ38hbqvwPL; every ABI here is vendored from that deployment's own pinned IPFS CIDs rather than re-resolved."""

