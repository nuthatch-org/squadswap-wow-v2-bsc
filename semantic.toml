[view]

# Authored views (views/*.sql) are described here so the MCP/`/schema` can render them:
# [view.your_view_name]
# description = "What this derivation computes."

# ── authored views (views/*.sql) ─────────────────────────────────────────────

[view.pools]
description = "The pool registry - one row per pool the factory has ever created, with its token pair, launch fee tier and tick spacing. The spine the rest of the views hang off."
grain = "one row per pool ever created"

[view.pool_custom_fee_current]
description = "The current state of SquadSwap's per-pool fee override: the latest SetCustomFee per pool, paired with the latest ToggleCustomFee. A pool with a custom fee set but override_enabled = false is charging its launch fee, not the override."
grain = "one row per pool that has ever had a custom fee set"

[view.pool_effective_fee]
description = "The fee each pool is actually charging: the override where one is set and enabled, otherwise the launch tier. Use this for anything fee-weighted - reading factory__pool_created.fee alone silently ignores the override layer."
grain = "one row per pool"

[view.swaps]
description = "Every swap across every discovered pool, joined to its pair and the fee actually in force. price_token1_per_token0 is derived from sqrtPriceX96 and is in RAW token units - multiply by 10^(decimals0-decimals1) for a human price."
grain = "one row per Swap event"

[view.liquidity_events]
description = "Mints and burns as one stream with a `kind` discriminator. Burn amounts are reported positive by the contract; a burn is a removal by virtue of its kind, not by carrying a negative number."
grain = "one row per Mint or Burn event"

[view.tokens]
description = "Every token appearing in any pool, ranked by pool count - a rough centrality measure that floats the quote assets to the top."
grain = "one row per distinct token address"

[view.position_owners]
description = "Current owner of each position NFT, taken as the latest Transfer for that tokenId. A mint appears as a transfer from the zero address, a burn as one to it."
grain = "one row per position NFT"

[view.position_liquidity]
description = "Net liquidity per position: everything added minus everything removed. A position at zero has been fully withdrawn but its NFT may still exist and still be owned."
grain = "one row per position NFT that has ever had liquidity"

[view.pool_activity]
description = "Per-pool activity summary, ordered by swap count. The first place to look when asking which pools actually matter, since a factory-discovered registry always has a long tail of pools created once and never used."
grain = "one row per pool"
